name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build DoubleClickFix/DoubleClickFix.csproj --no-restore --configuration Release --property:SkipWapProjects=true
      shell: pwsh

    - name: Package binaries
      run: |
        mkdir Release
        Copy-Item -Path DoubleClickFix/bin/Release/net10.0-windows10.0.17763.0/* -Destination Release/ -Recurse        
      shell: pwsh

    - name: Create ZIP file
      run: Compress-Archive -Path Release/* -DestinationPath DoubleClickFix.zip
      shell: pwsh

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          DoubleClickFix 中文汉化版发布。
          
          下载二进制文件，解压 DoubleClickFix.zip 并启动 DoubleClickFix.exe。
          程序将显示在 Windows 系统托盘。双击该图标可打开 UI 并调整设置。
          仅支持 Windows 系统。需要 .NET 10 运行环境。
        draft: false
        prerelease: false

    - name: Upload release assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./DoubleClickFix.zip
        asset_name: DoubleClickFix.zip
        asset_content_type: application/zip
