name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Publish
      run: dotnet publish DoubleClickFix/DoubleClickFix.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o PublishOutput
      shell: pwsh

    - name: Create ZIP file
      run: Compress-Archive -Path PublishOutput/* -DestinationPath DoubleClickFix.zip
      shell: pwsh

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          DoubleClickFix 中文汉化版发布。
          
          直接下载并运行 DoubleClickFix.exe 即可。
          程序将显示在 Windows 系统托盘。双击该图标可打开 UI 并调整设置。
          仅支持 Windows 系统。需要 .NET 10 运行环境。
        draft: false
        prerelease: false

    - name: Upload ZIP asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./DoubleClickFix.zip
        asset_name: DoubleClickFix.zip
        asset_content_type: application/zip

    - name: Upload EXE asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./PublishOutput/DoubleClickFix.exe
        asset_name: DoubleClickFix.exe
        asset_content_type: application/octet-stream
