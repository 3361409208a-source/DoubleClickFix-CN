name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore

    - name: Publish (Small Multi-file ZIP - No dependency)
      run: |
        dotnet publish DoubleClickFix/DoubleClickFix.csproj -c Release --self-contained false -p:PublishSingleFile=false -o MultiFileOutput
        Compress-Archive -Path MultiFileOutput/* -DestinationPath DoubleClickFix-Small.zip
      shell: pwsh

    - name: Publish (Single EXE - Portable Edition)
      run: |
        dotnet clean DoubleClickFix/DoubleClickFix.csproj -c Release
        dotnet publish DoubleClickFix/DoubleClickFix.csproj -c Release -r win-x64 -p:SelfContained=false -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o SingleFilePortableOutput
      shell: pwsh

    - name: Publish (Single EXE - Standalone Edition)
      run: |
        dotnet clean DoubleClickFix/DoubleClickFix.csproj -c Release
        dotnet publish DoubleClickFix/DoubleClickFix.csproj -c Release -r win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=true -p:TrimMode=link -o SingleFileStandaloneOutput
      shell: pwsh

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          DoubleClickFix 中文汉化版发布 (v1.5.6-CN)。
          
          **下载说明 (任选其一)：**
          1. **`DoubleClickFix-Standalone.exe`** (独立单文件)：**零依赖！** 即使没装 .NET 10 环境也能运行。已开启代码剪裁优化及压缩。
          2. **`DoubleClickFix-Portable.exe`** (轻便单文件)：便捷版。需电脑已安装 .NET 10 桌面运行时。体积较小。
          3. **`DoubleClickFix-Small.zip`** (多文件原生包)：极致小巧。解压运行，需 .NET 10 环境。
          
          程序将显示在 Windows 系统托盘。双击该图标可打开 UI 并调整设置。
        draft: false
        prerelease: false

    - name: Upload Standalone EXE
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./SingleFileStandaloneOutput/DoubleClickFix.exe
        asset_name: DoubleClickFix-Standalone.exe
        asset_content_type: application/octet-stream

    - name: Upload Portable EXE
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./SingleFilePortableOutput/DoubleClickFix.exe
        asset_name: DoubleClickFix-Portable.exe
        asset_content_type: application/octet-stream

    - name: Upload Small ZIP
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./DoubleClickFix-Small.zip
        asset_name: DoubleClickFix-Small.zip
        asset_content_type: application/zip
