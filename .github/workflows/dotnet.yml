name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore

    - name: Publish (Small Multi-file ZIP)
      run: |
        dotnet publish DoubleClickFix/DoubleClickFix.csproj -c Release --self-contained false -p:PublishSingleFile=false -o MultiFileOutput
        Compress-Archive -Path MultiFileOutput/* -DestinationPath DoubleClickFix-Small.zip
      shell: pwsh

    - name: Publish (Single EXE - Portable Edition)
      run: |
        dotnet clean DoubleClickFix/DoubleClickFix.csproj -c Release
        dotnet publish DoubleClickFix/DoubleClickFix.csproj -c Release -r win-x64 -p:SelfContained=false -p:PublishSingleFile=true -o SingleFilePortableOutput
      shell: pwsh

    - name: Publish (Single EXE - Standalone Edition)
      run: |
        dotnet clean DoubleClickFix/DoubleClickFix.csproj -c Release
        dotnet publish DoubleClickFix/DoubleClickFix.csproj -c Release -r win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=true -o SingleFileStandaloneOutput
      shell: pwsh

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          DoubleClickFix 中文汉化精简版 (v1.5.3-CN)。
          
          **下载选项（请按需选择）：**
          1. **`DoubleClickFix-Standalone.exe`** (独立单文件)：**零依赖！** 内置运行环境，且开启了强力压缩。建议电脑没装 .NET 的用户下载。
          2. **`DoubleClickFix-Portable.exe`** (轻便单文件)：便捷版。单文件，需要电脑装有 .NET 10 环境。体积非常精简。
          3. **`DoubleClickFix-Small.zip`** (多文件压缩包)：极致小巧（约6MB）。适合追求极致体积的用户。
        draft: false
        prerelease: false

    - name: Upload Standalone EXE
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./SingleFileStandaloneOutput/DoubleClickFix.exe
        asset_name: DoubleClickFix-Standalone.exe
        asset_content_type: application/octet-stream

    - name: Upload Portable EXE
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./SingleFilePortableOutput/DoubleClickFix.exe
        asset_name: DoubleClickFix-Portable.exe
        asset_content_type: application/octet-stream

    - name: Upload Small ZIP
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./DoubleClickFix-Small.zip
        asset_name: DoubleClickFix-Small.zip
        asset_content_type: application/zip
