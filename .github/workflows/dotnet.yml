name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore

    - name: Publish (Small Multi-file)
      run: dotnet publish DoubleClickFix/DoubleClickFix.csproj -c Release --self-contained false -o MultiFileOutput
      shell: pwsh

    - name: Publish (Single EXE)
      run: dotnet publish DoubleClickFix/DoubleClickFix.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o SingleFileOutput
      shell: pwsh

    - name: Create ZIP file (Small Multi-file)
      run: Compress-Archive -Path MultiFileOutput/* -DestinationPath DoubleClickFix-Small.zip
      shell: pwsh

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          DoubleClickFix 中文汉化版发布。
          
          **下载选项：**
          1. **`DoubleClickFix.exe`** (单文件，55MB)：推荐！下载后可直接运行，无需解压。适合追求便捷的用户。
          2. **`DoubleClickFix-Small.zip`** (多文件压缩包，约6MB)：极致轻量！解压后运行文件夹内的 `DoubleClickFix.exe`。适合追求最小体积的用户。
          
          程序将显示在 Windows 系统托盘。双击该图标可打开 UI 并调整设置。
          仅支持 Windows 系统。需要 .NET 10 运行环境。
        draft: false
        prerelease: false

    - name: Upload Single EXE asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./SingleFileOutput/DoubleClickFix.exe
        asset_name: DoubleClickFix.exe
        asset_content_type: application/octet-stream

    - name: Upload Small ZIP asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./DoubleClickFix-Small.zip
        asset_name: DoubleClickFix-Small.zip
        asset_content_type: application/zip
